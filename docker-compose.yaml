services:
    backend:
        build:
            context: .
            dockerfile: docker/Dockerfile
        container_name: e-commerce-backend
        restart: unless-stopped
        ports:
            - "5000:5000"
        env_file:
            - .env
        environment:
            DB_HOST: db
            DB_PORT: 5432
        depends_on:
            db:
                condition: service_healthy
        networks:
            - ecommerce-network

    db:
        image: postgres:17
        container_name: ecommerce-database
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_NAME}
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test:
                - CMD-SHELL
                - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
            interval: 5s
            timeout: 5s
            retries: 10
        networks:
            - ecommerce-network

networks:
    ecommerce-network:
        driver: bridge

volumes:
    postgres_data:
        name: ecommerce_postgres_data
